name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run E2E tests nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - publishing
          - discovery
          - consumption
          - approval


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start test infrastructure and microservices
        run: |
          docker-compose -f tests/e2e/docker-compose.test.yml up -d --build
          sleep 30

      - name: Verify services are healthy
        run: |
          curl -f http://localhost:3001/health || exit 1
          curl -f http://localhost:3002/health || exit 1
          curl -f http://localhost:3003/health || exit 1
          curl -f http://localhost:3004/health || exit 1

      - name: Run E2E tests - ${{ matrix.test-suite }}
        working-directory: tests/e2e
        run: npm run test:${{ matrix.test-suite }}
        env:
          CI: true
          NODE_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ matrix.test-suite }}
          path: |
            tests/e2e/reports/
            tests/e2e/coverage/
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs-${{ matrix.test-suite }}
          path: |
            tests/e2e/logs/
          retention-days: 7

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          docker-compose -f tests/e2e/docker-compose.test.yml logs > tests/e2e/logs/docker-compose.log

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f tests/e2e/docker-compose.test.yml down -v

  e2e-summary:
    name: E2E Test Summary
    needs: e2e-tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "✅ All E2E tests passed"
            exit 0
          else
            echo "❌ Some E2E tests failed"
            exit 1
          fi

      - name: Post to Slack
        if: failure() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "E2E Tests Failed on main branch",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ E2E tests failed on `main` branch\n*Workflow:* ${{ github.workflow }}\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
