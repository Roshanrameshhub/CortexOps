---
# Deprecation Agent Kubernetes Configuration
# Classification: LIFECYCLE MANAGEMENT
# Deployed as part of unified Marketplace agents service

apiVersion: v1
kind: ConfigMap
metadata:
  name: deprecation-agent-config
  namespace: llm-marketplace
  labels:
    app: deprecation-agent
    component: agents
    classification: lifecycle-management
data:
  LOG_LEVEL: "info"
  AGENT_VERSION: "1.0.0"
  MAX_CONSUMERS_AUTO_DEPRECATION: "100"
  DEFAULT_SUNSET_PERIOD_DAYS: "90"
  TELEMETRY_ENABLED: "true"
  RUVECTOR_TIMEOUT_MS: "30000"
  RUVECTOR_RETRY_ATTEMPTS: "3"
  RUVECTOR_RETRY_BACKOFF_MS: "1000"

---
apiVersion: v1
kind: Secret
metadata:
  name: deprecation-agent-secrets
  namespace: llm-marketplace
  labels:
    app: deprecation-agent
type: Opaque
stringData:
  RUVECTOR_API_KEY: "${RUVECTOR_API_KEY}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deprecation-agent
  namespace: llm-marketplace
  labels:
    app: deprecation-agent
    component: agents
    classification: lifecycle-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deprecation-agent
  template:
    metadata:
      labels:
        app: deprecation-agent
        component: agents
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: marketplace-agents
      containers:
        - name: deprecation-agent
          image: gcr.io/${PROJECT_ID}/deprecation-agent:${VERSION}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: deprecation-agent-config
            - secretRef:
                name: deprecation-agent-secrets
          env:
            - name: RUVECTOR_SERVICE_URL
              value: "http://ruvector-service.llm-marketplace.svc.cluster.local:8080"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: deprecation-agent
  namespace: llm-marketplace
  labels:
    app: deprecation-agent
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: deprecation-agent

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: deprecation-agent-hpa
  namespace: llm-marketplace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deprecation-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: deprecation-agent-pdb
  namespace: llm-marketplace
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: deprecation-agent

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deprecation-agent-network-policy
  namespace: llm-marketplace
spec:
  podSelector:
    matchLabels:
      app: deprecation-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: llm-marketplace
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: llm-marketplace
        - podSelector:
            matchLabels:
              app: ruvector-service
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443  # For external HTTPS calls
